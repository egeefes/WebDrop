  <script>
    const RELAY_WS = "wss://airdrop-relay.mail-2dc.workers.dev/ws";

    let ws = null;
    let mySessionId = null;
    let myRole = null; // 'send' or 'recv'
    let currentFiles = [];
    let currentSessionMeta = null;
    let pendingSessionId = null;
    let userName = null;
    let sessionName = null; // Separate session name that persists

    // Transfer state
    let rxChunks = [];
    let rxMeta = null;
    let rxBytes = 0;
    let currentFileIndex = 0;
    let totalFiles = 0;

    init();

    function init() {
      console.log('Initializing app...');
      try {
        setupEventListeners();
        console.log('Event listeners setup complete');
      } catch (e) {
        console.error('Error setting up event listeners:', e);
      }

      try {
        loadOrCreateUserName();
        loadSessionName();
        console.log('Username and session name loaded');
      } catch (e) {
        console.error('Error loading username:', e);
      }

      try {
        connect();
        console.log('WebSocket connection initiated');
      } catch (e) {
        console.error('Error connecting:', e);
      }
    }

    function loadOrCreateUserName() {
      // Try to get name from cookie
      const savedName = getCookie('airdrop_username');

      console.log('Loading username from cookie:', savedName);
      console.log('All cookies:', document.cookie);

      if (savedName) {
        userName = savedName;
        console.log('Using saved name:', userName);
      } else {
        // Generate random 4-character name
        userName = generateRandomName();
        console.log('Generated new name:', userName);
        setCookie('airdrop_username', userName, 365);
      }

      document.getElementById('userNameDisplay').textContent = userName;
    }

    function loadSessionName() {
      // Try to get session name from cookie, fallback to userName
      const savedSessionName = getCookie('airdrop_sessionname');

      console.log('Loading session name from cookie:', savedSessionName);

      if (savedSessionName) {
        sessionName = savedSessionName;
        console.log('Using saved session name:', sessionName);
      } else {
        // Default to userName
        sessionName = userName;
        console.log('Using userName as session name:', sessionName);
      }
    }

    function generateRandomName() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let name = '';
      for (let i = 0; i < 4; i++) {
        name += chars[Math.floor(Math.random() * chars.length)];
      }
      return name;
    }

    function setCookie(name, value, days) {
      const expires = new Date();
      expires.setTime(expires.getTime() + days * 24 * 60 * 60 * 1000);
      document.cookie = `${name}=${encodeURIComponent(value)};expires=${expires.toUTCString()};path=/;SameSite=Lax`;
      console.log('Set cookie:', name, '=', value);
    }

    function getCookie(name) {
      const nameEQ = name + "=";
      const ca = document.cookie.split(';');
      for (let i = 0; i < ca.length; i++) {
        let c = ca[i];
        while (c.charAt(0) === ' ') c = c.substring(1, c.length);
        if (c.indexOf(nameEQ) === 0) {
          const value = decodeURIComponent(c.substring(nameEQ.length, c.length));
          console.log('Got cookie:', name, '=', value);
          return value;
        }
      }
      console.log('Cookie not found:', name);
      return null;
    }

    function connect() {
      ws = new WebSocket(RELAY_WS);
      ws.binaryType = "arraybuffer";

      ws.onopen = () => {
        console.log('Connected to server');
        // Request session list on connect
        setTimeout(() => {
          send({ type: "GET_SESSIONS" });
        }, 200);
      };

      ws.onmessage = (ev) => {
        if (typeof ev.data === "string") {
          try {
            const msg = JSON.parse(ev.data);
            console.log('Received message:', msg.type);
            handleMessage(msg);
          } catch (e) {
            console.error('Parse error:', e);
          }
          return;
        }

        // Binary chunk
        if (myRole === 'recv') {
          rxChunks.push(ev.data);
          rxBytes += ev.data.byteLength;

          if (rxMeta) {
            const progress = Math.round((rxBytes / rxMeta.size) * 100);
            showProgress(`Receiving ${currentFileIndex + 1}/${totalFiles}`, progress);

            if (rxBytes >= rxMeta.size) finishDownload();
          }
        }
      };

      ws.onclose = () => {
        console.log('Disconnected, reconnecting...');
        setTimeout(connect, 1000);
      };

      ws.onerror = (e) => {
        console.error('WebSocket error:', e);
      };
    }

    function handleMessage(msg) {
      if (msg.type === "SESSION_LIST") {
        console.log('Received session list:', msg.sessions.length, 'sessions');
        renderSessions(msg.sessions);
      }
      else if (msg.type === "SESSION_CREATED") {
        mySessionId = msg.sessionId;
        myRole = 'send';
        console.log('Session created:', msg.sessionId);

        // Show user name and controls in lobby for hosts
        document.getElementById('userNameContainer').classList.remove('hidden');
        document.getElementById('privateCheckboxContainer').classList.remove('hidden');
        console.log('Showing user name container and private checkbox for host');

        if (msg.passcode) {
          document.getElementById('passcodeText').textContent = msg.passcode;
          document.getElementById('passcodeDisplay').classList.remove('hidden');
        }

        // Use sessionName (which persists) for the session view
        showSessionView(sessionName, currentSessionMeta, true, msg.isPrivate);
      }
      else if (msg.type === "PRIVACY_TOGGLED") {
        const isPrivate = msg.isPrivate;
        const passcodeDisplay = document.getElementById('passcodeDisplay');
        const lockIcon = document.getElementById('lockIcon');
        const toggleText = document.getElementById('privacyToggleText');

        if (isPrivate) {
          document.getElementById('passcodeText').textContent = msg.passcode;
          passcodeDisplay.classList.remove('hidden');
          toggleText.textContent = 'Make Public';
          lockIcon.innerHTML = '<path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>';
        } else {
          passcodeDisplay.classList.add('hidden');
          toggleText.textContent = 'Make Private';
          lockIcon.innerHTML = '<path d="M10 2a5 5 0 00-5 5v2a2 2 0 00-2 2v5a2 2 0 002 2h10a2 2 0 002-2v-5a2 2 0 00-2-2H7V7a3 3 0 015.905-.75 1 1 0 001.937-.5A5.002 5.002 0 0010 2z"></path>';
        }
      }
      else if (msg.type === "JOINED_SESSION") {
        mySessionId = msg.sessionId;
        myRole = 'recv';
        currentSessionMeta = msg.meta;
        console.log('Joined session:', msg.sessionId);

        const session = document.querySelector(`[data-session-id="${msg.sessionId}"]`);
        const name = session ? session.querySelector('.session-name').textContent : 'Session';

        showSessionView(name, msg.meta, false);
        hideModal('passcodeModal');
      }
      else if (msg.type === "ERROR") {
        console.error('Server error:', msg.message);
        showPasscodeError(msg.message);
      }
      else if (msg.type === "START_SEND") {
        if (myRole === 'send') {
          console.log('Starting send...');
          sendNextFile();
        }
      }
      else if (msg.type === "metadata") {
        if (myRole === 'recv') {
          rxMeta = msg;
          rxChunks = [];
          rxBytes = 0;
          currentFileIndex = msg.fileIndex || 0;
          totalFiles = msg.totalFiles || 1;
          showProgress(`Receiving ${currentFileIndex + 1}/${totalFiles}`, 0);
        }
      }
      else if (msg.type === "NEXT_FILE") {
        if (myRole === 'send') {
          console.log('Sending next file...');
          sendNextFile();
        }
      }
      else if (msg.type === "SESSION_CLOSED") {
        console.log('Session closed by sender');
        //alert('Session has ended');
        backToLobby();
      }
      else if (msg.type === "LEFT_SESSION") {
        console.log('Left session successfully');
      }
    }

    function renderSessions(sessions) {
      const container = document.getElementById('sessionsContainer');

      console.log('Rendering', sessions.length, 'sessions');

      container.innerHTML = sessions.map(s => {
        const initials = s.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
        const colors = ['from-blue-500 to-purple-600', 'from-green-500 to-teal-600', 'from-pink-500 to-red-600', 'from-yellow-500 to-orange-600', 'from-indigo-500 to-blue-600'];
        const color = colors[s.id.charCodeAt(0) % colors.length];

        return `
          <div data-session-id="${s.id}" class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow-lg hover:shadow-xl transition cursor-pointer group" onclick="joinSession('${s.id}', ${s.isPrivate})">
            <div class="w-16 h-16 bg-gradient-to-br ${color} rounded-full flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition">
              <span class="text-2xl font-bold text-white">${initials}</span>
            </div>
            <p class="session-name text-center font-semibold text-gray-900 dark:text-gray-100 truncate mb-1">${s.name}</p>
            <p class="text-xs text-center text-gray-600 dark:text-gray-400">${s.fileCount} file${s.fileCount !== 1 ? 's' : ''}</p>
            ${s.isPrivate ? '<div class="flex justify-center mt-2"><svg class="w-4 h-4 text-yellow-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path></svg></div>' : ''}
          </div>
        `;
      }).join('');
    }

    function setupEventListeners() {
      console.log('Setting up event listeners...');
      const dropzone = document.getElementById("dropzone");
      const fileInput = document.getElementById("fileInput");

      // Verify critical elements exist
      const saveUserNameBtn = document.getElementById("saveUserNameBtn");
      const editUserNameBtn = document.getElementById("editUserNameBtn");
      console.log('saveUserNameBtn exists:', !!saveUserNameBtn);
      console.log('editUserNameBtn exists:', !!editUserNameBtn);

      dropzone.addEventListener("click", (e) => {
        // Don't trigger file input if clicking on checkbox
        if (e.target.id === 'privateCheckbox') return;
        fileInput.click();
      });

      dropzone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropzone.classList.add("border-indigo-500", "bg-indigo-100");
      });

      dropzone.addEventListener("dragleave", (e) => {
        e.preventDefault();
        dropzone.classList.remove("border-indigo-500", "bg-indigo-100");
      });

      dropzone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropzone.classList.remove("border-indigo-500", "bg-indigo-100");
        const files = Array.from(e.dataTransfer.files || []);
        if (files.length > 0) processFiles(files);
      });

      fileInput.addEventListener("change", (e) => {
        const files = Array.from(e.target.files || []);
        e.target.value = "";
        if (files.length > 0) processFiles(files);
      });

      document.getElementById("backBtn").addEventListener("click", backToLobby);
      document.getElementById("downloadBtn").addEventListener("click", requestDownload);
      document.getElementById("endSessionBtn").addEventListener("click", endSession);
      document.getElementById("privacyToggleBtn").addEventListener("click", togglePrivacy);
      document.getElementById("editSessionNameBtn").addEventListener("click", () => {
        document.getElementById('editNameSection').classList.toggle('hidden');
      });
      document.getElementById("saveNameBtn").addEventListener("click", saveSessionName);

      console.log('About to set up passcode listeners...');
      document.getElementById("submitPasscodeBtn").addEventListener("click", submitPasscode);
      document.getElementById("cancelPasscodeBtn").addEventListener("click", () => hideModal('passcodeModal'));

      document.getElementById("passcodeInput").addEventListener("input", (e) => {
        e.target.value = e.target.value.toUpperCase();
      });

      console.log('About to set up user name edit listeners...');
      // User name editing
      document.getElementById("editUserNameBtn").addEventListener("click", () => {
        console.log('Edit button clicked');
        document.getElementById('userNameInput').value = userName;
        showModal('userNameModal');
      });

      console.log('About to bind saveUserNameBtn...');
      const saveBtn = document.getElementById("saveUserNameBtn");
      console.log('saveBtn element:', saveBtn);

      saveBtn.addEventListener("click", () => {
        console.log('Save button clicked');
        const newName = document.getElementById('userNameInput').value.trim();
        console.log('New name from input:', newName);
        if (newName && newName.length > 0) {
          userName = newName;
          console.log('Saving new username:', userName);
          setCookie('airdrop_username', userName, 365);
          console.log('Cookie after save:', document.cookie);
          document.getElementById('userNameDisplay').textContent = userName;
          hideModal('userNameModal');

          // If user is currently hosting a session, update the session name
          if (mySessionId && myRole === 'send') {
            send({ type: "UPDATE_SESSION_NAME", name: userName });
            document.getElementById('sessionName').textContent = userName;
            document.getElementById('sessionInitials').textContent = userName.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
          }
        } else {
          console.log('Name is empty, not saving');
        }
      });

      console.log('saveUserNameBtn listener attached');

      document.getElementById("cancelUserNameBtn").addEventListener("click", () => {
        hideModal('userNameModal');
      });

      // Enter key support for modals
      document.getElementById("userNameInput").addEventListener("keypress", (e) => {
        console.log('Keypress in username input:', e.key);
        if (e.key === 'Enter') {
          e.preventDefault();
          console.log('Enter key pressed, triggering save');
          document.getElementById("saveUserNameBtn").click();
        }
      });

      document.getElementById("passcodeInput").addEventListener("keypress", (e) => {
        if (e.key === 'Enter') {
          document.getElementById("submitPasscodeBtn").click();
        }
      });
    }

    function processFiles(files) {
      currentFiles = files;
      const totalSize = files.reduce((sum, f) => sum + f.size, 0);

      currentSessionMeta = {
        count: files.length,
        totalSize: totalSize,
        files: files.map(f => ({
          name: f.name,
          size: f.size,
          mimeType: f.type || "application/octet-stream"
        }))
      };

      const isPrivate = document.getElementById('privateCheckbox').checked;
      startSharing(isPrivate);
    }

    function startSharing(isPrivate) {
      send({
        type: "CREATE_SESSION",
        deviceName: sessionName, // Use sessionName instead of userName
        isPrivate: isPrivate,
        meta: currentSessionMeta
      });
    }

    function joinSession(sessionId, isPrivate) {
      if (isPrivate) {
        pendingSessionId = sessionId;
        showModal('passcodeModal');
        document.getElementById('passcodeInput').value = '';
        document.getElementById('passcodeError').classList.add('hidden');
      } else {
        send({ type: "JOIN_SESSION", sessionId });
      }
    }

    function submitPasscode() {
      const passcode = document.getElementById('passcodeInput').value.toUpperCase();
      if (passcode.length !== 4) return;

      send({
        type: "JOIN_SESSION",
        sessionId: pendingSessionId,
        passcode: passcode
      });
    }

    function showPasscodeError(msg) {
      const el = document.getElementById('passcodeError');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function requestDownload() {
      rxChunks = [];
      rxMeta = null;
      rxBytes = 0;
      currentFileIndex = 0;
      totalFiles = currentSessionMeta?.count || 1;

      send({ type: "REQUEST_FILE" });
    }

    function sendNextFile() {
      if (currentFileIndex >= currentFiles.length) {
        hideProgress();
        return;
      }

      const file = currentFiles[currentFileIndex];
      sendFile(file, currentFileIndex, currentFiles.length);
    }

    function sendFile(file, idx, total) {
      showProgress(`Sending ${idx + 1}/${total}`, 0);

      send({
        type: "metadata",
        name: file.name,
        size: file.size,
        mimeType: file.type || "application/octet-stream",
        fileIndex: idx,
        totalFiles: total
      });

      const chunkSize = 64 * 1024;
      let offset = 0;
      const reader = new FileReader();

      reader.onload = (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;

        ws.send(e.target.result);
        offset += e.target.result.byteLength;

        const progress = Math.round((offset / file.size) * 100);
        showProgress(`Sending ${idx + 1}/${total}`, progress);

        if (offset < file.size) {
          readSlice(offset);
        } else {
          currentFileIndex++;
          if (currentFileIndex < total) {
            send({ type: "FILE_COMPLETE" });
          } else {
            hideProgress();
          }
        }
      };

      function readSlice(o) {
        reader.readAsArrayBuffer(file.slice(o, o + chunkSize));
      }
      readSlice(0);
    }

    function finishDownload() {
      const blob = new Blob(rxChunks, { type: rxMeta.mimeType });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = rxMeta.name;
      a.click();

      URL.revokeObjectURL(url);

      rxChunks = [];
      rxBytes = 0;
      currentFileIndex++;

      if (currentFileIndex < totalFiles) {
        send({ type: "READY_FOR_NEXT" });
      } else {
        hideProgress();
      }
    }

    function saveSessionName() {
      const name = document.getElementById('editNameInput').value.trim();
      if (!name) return;

      sessionName = name;
      setCookie('airdrop_sessionname', sessionName, 365);
      console.log('Saved session name to cookie:', sessionName);

      send({ type: "UPDATE_SESSION_NAME", name: sessionName });
      document.getElementById('sessionName').textContent = sessionName;
      document.getElementById('sessionInitials').textContent = sessionName.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
      document.getElementById('editNameSection').classList.add('hidden');
    }

    function togglePrivacy() {
      const session = mySessionId ? { id: mySessionId } : null;
      if (!session) return;

      send({ type: "TOGGLE_PRIVACY" });
    }

    function endSession() {
      send({ type: "LEAVE_SESSION" });
      backToLobby();
    }

    function backToLobby() {
      mySessionId = null;
      myRole = null;
      currentFiles = [];
      currentSessionMeta = null;

      document.getElementById('lobbyView').classList.remove('hidden');
      document.getElementById('sessionView').classList.add('hidden');
      document.getElementById('passcodeDisplay').classList.add('hidden');
      document.getElementById('editNameSection').classList.add('hidden');
      document.getElementById('editSessionNameBtn').classList.add('hidden');

      // Hide user controls when not hosting
      document.getElementById('userNameContainer').classList.add('hidden');
      document.getElementById('privateCheckboxContainer').classList.add('hidden');

      hideProgress();

      // Request fresh session list
      setTimeout(() => {
        send({ type: "GET_SESSIONS" });
      }, 200);
    }

    function showSessionView(name, meta, isSender, isPrivate) {
      document.getElementById('lobbyView').classList.add('hidden');
      document.getElementById('sessionView').classList.remove('hidden');

      const initials = name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
      document.getElementById('sessionInitials').textContent = initials;
      document.getElementById('sessionName').textContent = name;

      const displayName = meta.count > 1 ? `${meta.count} files` : meta.files[0].name;
      const size = (meta.totalSize / 1024 / 1024).toFixed(2);

      document.getElementById('fileInfo').textContent = displayName;
      document.getElementById('fileSize').textContent = `${size} MB`;

      // Hide back button for senders, show for receivers
      document.getElementById('backBtn').classList.toggle('hidden', isSender);
      document.getElementById('downloadBtn').classList.toggle('hidden', isSender);
      document.getElementById('endSessionBtn').classList.toggle('hidden', !isSender);
      document.getElementById('privacyToggleBtn').classList.toggle('hidden', !isSender);
      document.getElementById('editSessionNameBtn').classList.toggle('hidden', !isSender);

      if (isSender) {
        document.getElementById('editNameInput').value = name;

        // Update privacy toggle button state
        const lockIcon = document.getElementById('lockIcon');
        const toggleText = document.getElementById('privacyToggleText');

        if (isPrivate) {
          toggleText.textContent = 'Make Public';
          lockIcon.innerHTML = '<path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>';
        } else {
          toggleText.textContent = 'Make Private';
          lockIcon.innerHTML = '<path d="M10 2a5 5 0 00-5 5v2a2 2 0 00-2 2v5a2 2 0 002 2h10a2 2 0 002-2v-5a2 2 0 00-2-2H7V7a3 3 0 015.905-.75 1 1 0 001.937-.5A5.002 5.002 0 0010 2z"></path>';
        }
      }
    }

    function showModal(id) {
      document.getElementById(id).classList.remove('hidden');
    }

    function hideModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function showProgress(label, percent) {
      document.getElementById('progressBox').classList.remove('hidden');
      document.getElementById('progressLabel').textContent = label;
      document.getElementById('progressPercent').textContent = percent + '%';
      document.getElementById('progressBar').style.width = percent + '%';
    }

    function hideProgress() {
      setTimeout(() => {
        document.getElementById('progressBox').classList.add('hidden');
      }, 1000);
    }

    function send(data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(data));
      }
    }
  </script>
</body>
</html>
